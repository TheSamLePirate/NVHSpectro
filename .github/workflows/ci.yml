name: CI

# AAA plan step 0.5 — every push proves: hygiene gates, style (baselined),
# unit tests incl. golden DSP snapshot, Android lint, debug AND minified
# release assembly (the ProGuard gate the project never had, audit C15).

on:
  push:
    branches: ["master", "aaa/**"]
  pull_request:

env:
  KTLINT_VERSION: "1.5.0"
  DETEKT_VERSION: "1.23.8"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Repo hygiene gates
        run: ./ci/checks.sh
        env:
          ARM_SAMPLE_RATE_GATE: "1"  # armed in Phase 1 (plan 1.1, audit C1)

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: ktlint (baselined)
        run: |
          curl -sSL -o /tmp/ktlint \
            "https://github.com/pinterest/ktlint/releases/download/${KTLINT_VERSION}/ktlint"
          chmod +x /tmp/ktlint
          /tmp/ktlint --baseline=config/ktlint-baseline.xml \
            "app/src/main/**/*.kt" "app/src/test/**/*.kt" "core/src/**/*.kt"

      - name: detekt (baselined)
        run: |
          curl -sSL -o /tmp/detekt.zip \
            "https://github.com/detekt/detekt/releases/download/v${DETEKT_VERSION}/detekt-cli-${DETEKT_VERSION}.zip"
          unzip -qo /tmp/detekt.zip -d /tmp/detekt
          /tmp/detekt/detekt-cli-${DETEKT_VERSION}/bin/detekt-cli \
            --input app/src,core/src --build-upon-default-config \
            --baseline config/detekt-baseline.xml

      - name: Unit tests (characterization suite, :core + :app)
        run: ./gradlew :core:test :app:testDebugUnitTest

      - name: Core coverage gate (≥ 90% line) [plan §1]
        run: ./gradlew :core:koverVerify

      - name: Android lint (zero errors, no baseline)
        run: ./gradlew :app:lintDebug

      - name: Assemble debug + minified release
        run: ./gradlew :app:assembleDebug :app:assembleRelease

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Upload test and lint reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 7
