name: Deploy site to GitHub Pages

# The project website (site/ → marketing + documentation).
# Deploys on every push to master that touches the site or this workflow.
#
# Runs on every fork/mirror of the repo; the site itself derives its GitHub links
# from the host it is served from, so no per-account edit is needed.
#
# Prerequisites on a repo where this has never run (the step below can only
# auto-enable Pages when they are met):
#   * Settings → Pages → Source = "GitHub Actions"
#   * Settings → Actions → General → Workflow permissions = "Read and write"
#   * a private repo additionally needs a GitHub Pro/Team plan — otherwise
#     "Create Pages site failed: Resource not accessible by integration".

on:
  push:
    branches: ["master"]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Enable and configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
